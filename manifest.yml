---
applications:
  - name: tauphat
    memory: 1536M
    instances: 1
    path: target/taup-hat-studio-1.0.0.jar
    routes:
      - route: tauphat.apps.tas-ndc.kuhn-labs.com
    buildpacks:
      - java_buildpack_offline
    env:
      # stack_threads tells the buildpack's memory calculator how many 1M thread
      # stacks to reserve before sizing the heap. The default of 250 reserves
      # ~250M for a single-user app that runs ~50 threads. Lowering it to 80
      # keeps comfortable margin while returning ~170M to the heap.
      # Must stay consistent with server.tomcat.threads.max in application-cloud.properties.
      JBP_CONFIG_OPEN_JDK_JRE: '{ jre: { version: 21.+ }, memory_calculator: { stack_threads: 80 } }'
      JAVA_OPTS: '-XX:MaxDirectMemorySize=64m'
      SPRING_PROFILES_ACTIVE: cloud
      GCS_BUCKET_NAME: ((gcs-bucket-name))
      GCS_PROJECT_ID: ((gcs-project-id))
      FIREBASE_SITE_ID: ((firebase-site-id))
      FIREBASE_API_KEY: ((firebase-api-key))
      FIREBASE_AUTH_DOMAIN: ((firebase-auth-domain))
      FIREBASE_PROJECT_ID: ((gcs-project-id))
      FIREBASE_STORAGE_BUCKET: ((firebase-storage-bucket))
      FIREBASE_MESSAGING_SENDER_ID: ((firebase-messaging-sender-id))
      FIREBASE_APP_ID: ((firebase-web-app-id))
      RECAPTCHA_SITE_KEY: ((recaptcha-v3-site-key))
      # Gmail SMTP (app password) used to deliver commission requests
      MAIL_USERNAME: ((smtp-username))
      MAIL_PASSWORD: ((smtp-password))
      GOOGLE_CLIENT_ID: ((google-client-id))
      GOOGLE_CLIENT_SECRET: ((google-client-secret))
      TAUPHAT_ALLOWED_EMAILS: ((tauphat-allowed-emails))
      GOOGLE_APPLICATION_CREDENTIALS: /home/vcap/app/.google/credentials.json
      GOOGLE_CREDENTIALS_JSON: ((google-credentials-json))
    services:
      - th-db
    health-check-type: http
    health-check-http-endpoint: /actuator/health
