# Cloud Foundry Profile
# Automatically activated by java-cfenv when running on Cloud Foundry.
# The datasource is auto-configured from VCAP_SERVICES.

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.locations=classpath:db/migration

# Security
tauphat.security.local-mode=false

# Commission requests: drain the Firestore "mail" queue and deliver via Gmail SMTP
tauphat.commissions.enabled=true

# Tomcat threads
# This is a single-user CMS (access is restricted to TAUPHAT_ALLOWED_EMAILS) and
# uploads are issued sequentially by the UI, so the stock 200 worker threads are
# far more than the app can use. Each thread reserves 1M of stack in the Java
# Buildpack's memory calculation, so capping this frees that memory for the heap.
# Must stay consistent with memory_calculator.stack_threads in manifest.yml.
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=5
